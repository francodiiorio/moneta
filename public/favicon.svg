<!-- Source of truth for the app icon. public/pwa-192.png and pwa-512.png
     replicate this exact bar geometry (scaled from this 24-unit viewBox) —
     if you change the bars here, regenerate those PNGs to match, or the
     PWA "Add to Home Screen" icon will drift off-center again. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect width="24" height="24" rx="6" fill="#4338ca" />
  <rect x="5.5" y="10" width="3" height="8.5" rx="1" fill="#eef2ff" />
  <rect x="10.5" y="6" width="3" height="12.5" rx="1" fill="#eef2ff" />
  <rect x="15.5" y="12.5" width="3" height="6" rx="1" fill="#eef2ff" />
</svg>
